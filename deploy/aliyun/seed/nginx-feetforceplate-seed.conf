limit_req_zone $binary_remote_addr zone=seed_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=seed_auth:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=seed_connections:10m;

log_format feetforceplate_seed '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" '
                               '$status $body_bytes_sent request_id=$request_id';

server {
    listen 7443 ssl;
    listen [::]:7443 ssl;
    server_name _;

    ssl_certificate /etc/feetforceplate/tls/seed.crt;
    ssl_certificate_key /etc/feetforceplate/tls/seed.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FFPSeedTLS:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    access_log /var/log/nginx/feetforceplate-seed.access.log feetforceplate_seed;
    error_log /var/log/nginx/feetforceplate-seed.error.log warn;

    client_max_body_size 64m;
    client_header_timeout 10s;
    client_body_timeout 60s;
    keepalive_timeout 15s;
    send_timeout 60s;
    large_client_header_buffers 4 8k;
    limit_conn seed_connections 20;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location = /v1/access/login {
        limit_req zone=seed_auth burst=3 nodelay;
        proxy_pass http://127.0.0.1:8743;
    }

    location = /v1/access/activate {
        limit_req zone=seed_auth burst=3 nodelay;
        proxy_pass http://127.0.0.1:8743;
    }

    location = /v1/access/terminal-activate {
        limit_req zone=seed_auth burst=3 nodelay;
        proxy_pass http://127.0.0.1:8743;
    }

    location = /v1/platform/login {
        limit_req zone=seed_auth burst=3 nodelay;
        proxy_pass http://127.0.0.1:8743;
    }

    location / {
        limit_req zone=seed_general burst=40 nodelay;
        proxy_pass http://127.0.0.1:8743;
    }
}

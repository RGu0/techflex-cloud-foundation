name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref. Nine jobs start on every push, so a branch pushed three
# times in a minute held twenty-seven runners while only the last push could
# still be merged. `main` is excluded by name: its runs are the record of what
# the default branch does, and cancelling one loses that evidence for a commit
# that is already merged.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  merge-freshness:
    # A pull_request run tests the merge of this branch with the base as it
    # stood when the run started. Nothing re-tests that merge if the base
    # advances afterwards, so a PR can be green against a base that no longer
    # exists and take main red on merge. That has happened three times here:
    # 37d1cbe (PR #22) and d6416b7 (PR #26) both landed red and were fixed
    # only because the next merge happened to fix them.
    #
    # This job fails when the branch does not already contain the base tip.
    # It only produces the signal: main stays protected only if this check is
    # marked required in branch protection, alongside "require branches to be
    # up to date before merging". Enabling that is a repository settings
    # change and is deliberately not made from this workflow.
    name: Merge freshness
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require the branch to contain the base tip
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "$BASE_REF"
          base_tip="$(git rev-parse "origin/$BASE_REF")"
          if git merge-base --is-ancestor "$base_tip" "$HEAD_SHA"; then
            echo "Branch contains $BASE_REF tip $base_tip; the tested merge is current."
            exit 0
          fi
          behind="$(git rev-list --count "$HEAD_SHA..$base_tip")"
          echo "::error::This branch is $behind commit(s) behind $BASE_REF ($base_tip)."
          echo "CI would otherwise validate a merge against a base that is already stale."
          echo "Update the branch onto $BASE_REF and push, then this check passes."
          exit 1

  quality:
    name: ${{ matrix.os }} / ${{ matrix.action }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        action: [test, lint, build]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Run governed quality action (Unix)
        if: runner.os != 'Windows'
        run: ./dev ${{ matrix.action }}
      - name: Run governed quality action (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./dev.ps1 ${{ matrix.action }}

  release-evidence:
    name: Release evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked --extra dev
      - run: uv export --locked --extra dev --no-emit-project --no-hashes --format requirements-txt > audited-requirements.txt
      - run: uv run --locked --extra dev pip-audit --strict -r audited-requirements.txt --progress-spinner off
      - run: uv build --out-dir foundation-dist
      - run: >-
          uv run --locked --extra dev python scripts/record_foundation_release_baseline.py
          --project-root .
          --dist-dir foundation-dist
          --baseline-strategy legacy-httpx-client/1
          --output foundation-dist/release-evidence.json
      - uses: actions/upload-artifact@v7
        with:
          name: foundation-release-evidence
          path: foundation-dist/

  macos-release-evidence:
    name: macOS release evidence
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked --extra dev
      - run: uv build --out-dir foundation-dist
      - name: Record redacted macOS performance evidence
        shell: bash
        run: |
          python_version="$(uv run --locked --extra dev python -c 'import platform; print(platform.python_version())')"
          uv_version="$(uv --version)"
          uv run --locked --extra dev python scripts/record_foundation_release_baseline.py \
            --project-root . \
            --dist-dir foundation-dist \
            --baseline-strategy legacy-httpx-client/1 \
            --output foundation-dist/release-evidence.json \
            --macos-ci-evidence-output ci-evidence/macos-release-performance.json \
            --runner-os macOS \
            --python-version "$python_version" \
            --uv-version "$uv_version"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macos-release-performance-evidence
          path: ci-evidence/macos-release-performance.json

  windows-release-evidence:
    name: Windows release evidence
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked --extra dev
      - run: uv build --out-dir foundation-dist
      - name: Record redacted Windows performance evidence
        shell: pwsh
        run: |
          $pythonVersion = & uv run --locked --extra dev python -c "import platform; print(platform.python_version())"
          $uvVersion = (& uv --version).Trim()
          & uv run --locked --extra dev python scripts/record_foundation_release_baseline.py `
            --project-root . `
            --dist-dir foundation-dist `
            --baseline-strategy legacy-httpx-client/1 `
            --output foundation-dist/release-evidence.json `
            --windows-ci-evidence-output ci-evidence/windows-release-performance.json `
            --runner-os Windows `
            --python-version $pythonVersion `
            --uv-version $uvVersion
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-release-performance-evidence
          path: ci-evidence/windows-release-performance.json
